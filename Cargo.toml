[package]
name = "gitveil"
version = "1.3.4"
edition = "2021"
description = "Transparent file encryption in git (git-crypt compatible)"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
aes = "0.9"
ctr = "0.10"
cipher = "0.5"
hmac = "0.13"
sha1 = "0.11"
getrandom = "0.4"
thiserror = "2"
byteorder = "1"
zeroize = { version = "1", features = ["derive"] }
colored = "3.1.1"

[dev-dependencies]
tempfile = "3"
