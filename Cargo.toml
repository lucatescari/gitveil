[package]
name = "gitveil"
version = "1.3.4"
edition = "2021"
description = "Transparent file encryption in git (git-crypt compatible)"
license = "GPL-3.0-only"
repository = "https://github.com/lucatescari/gitveil"
homepage = "https://github.com/lucatescari/gitveil"
readme = "README.md"
keywords = ["git", "encryption", "git-crypt", "gpg", "secrets"]
categories = ["command-line-utilities", "cryptography"]
exclude = ["/benchmark", "/docs", "/scripts", "/.github", "/gitveil.svg", "/CLAUDE.md"]

[dependencies]
# Crypto crates: `zeroize` makes the expanded AES round keys, CTR state and
# HMAC ipad/opad state scrub themselves on drop. It changes no output bytes.
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
aes = { version = "0.9.4", features = ["zeroize"] }
ctr = { version = "0.10.1", features = ["zeroize"] }
cipher = { version = "0.5.2", features = ["zeroize"] }
hmac = { version = "0.13", features = ["zeroize"] }
sha1 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4.3"
thiserror = "2"
byteorder = "1"
zeroize = { version = "1.9.1", features = ["derive"] }
colored = "3.1.1"

[dev-dependencies]
tempfile = "3"
