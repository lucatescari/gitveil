name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
  schedule:
    # Weekly, so newly published advisories are caught without a push.
    - cron: "0 6 * * 1"

# Least privilege: every job here only reads the repo. Nothing publishes
# releases, pushes tags or comments on PRs, so no job widens this.
permissions:
  contents: read

# One run per ref; a newer push supersedes an in-flight PR run. Pushes to
# dev/master are never cancelled so every merge gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned so the cached binaries below are keyed on an exact version and get
  # rebuilt when it is bumped; an unversioned cache key kept a stale scanner
  # forever.
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_DENY_VERSION: 0.20.2

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes back to the repo, so the token must not be left
          # in .git/config where later steps (or a cached target/) could read it.
          persist-credentials: false

      - name: Install Rust toolchain
        # SHA-pinned to the `v1` tag, which tracks master where `toolchain` has
        # no default — so it must be named explicitly. The old `@stable` ref was
        # a branch whose action.yml defaulted it for us.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install git-crypt and GPG (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git-crypt gnupg

      - name: Install git-crypt and GPG (macOS)
        if: runner.os == 'macOS'
        run: brew install git-crypt gnupg

      - name: Install GPG (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          }
          scoop install gnupg
          gpg --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --bin gitveil

      - name: Integration tests
        run: cargo test --test integration

      - name: GPG integration tests
        run: cargo test --test gpg_integration

      - name: Cross-compatibility tests
        run: cargo test --test cross_compat

      - name: Security regression tests
        # Tamper detection, path/filename handling and GPG trust checks.
        run: cargo test --test security_filters --test security_git --test security_gpg

  msrv:
    name: MSRV (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # Keep in sync with `rust-version` in Cargo.toml.
          toolchain: "1.89"

      - name: Check build on MSRV
        run: cargo check --locked --all-targets

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes back to the repo, so the token must not be left
          # in .git/config where later steps (or a cached target/) could read it.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo-audit binary
        id: cache-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"

      - name: Audit dependencies
        # Fails the build on known vulnerabilities. RustSec informational
        # advisories (unsound / unmaintained) are reported as warnings only —
        # Dependabot does not surface those at all, so the log is the record.
        run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes back to the repo, so the token must not be left
          # in .git/config where later steps (or a cached target/) could read it.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache cargo-deny binary
        id: cache-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version "$CARGO_DENY_VERSION"

      - name: Check licenses, bans and sources
        # `advisories` is intentionally omitted — the cargo audit job above
        # already covers RustSec. This job guards the other three: license
        # compatibility with GPL-3.0-only, duplicate crate versions (a second
        # crypto trait generation in the graph), and dependencies resolving to
        # anything other than crates.io.
        run: cargo deny check licenses bans sources
