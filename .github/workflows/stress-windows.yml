# TEMPORARY debugging workflow — delete once the flake is understood.
# Reproduces test_status_fix_restages_only_warning_files on Windows by
# running it repeatedly and stopping at the first failure, so the
# diagnostics in the test's assertion message get captured.
name: stress-windows

on:
  push:
    branches: [debug/windows-status-fix-flake]
  workflow_dispatch:

jobs:
  stress:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build test binary once
        run: cargo test --test integration --no-run

      - name: Run the flaky test until it fails (max 50 attempts)
        shell: bash
        run: |
          for i in $(seq 1 50); do
            echo "::group::attempt $i"
            if ! cargo test --test integration test_status_fix_restages_only_warning_files -- --exact --nocapture; then
              echo "::endgroup::"
              echo "FAILED ON ATTEMPT $i"
              exit 1
            fi
            echo "::endgroup::"
          done
          echo "50/50 attempts passed — no reproduction this run"
